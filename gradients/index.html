<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>try{if(localStorage.getItem("cl-theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
  <meta name="author" content="Dev Asik, web developer and creator of Color Library" />
  <meta name="keywords" content="CSS gradients, linear gradient, radial gradient, conic gradient, mesh gradient, gradient CSS, color gradients, gradient generator" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <title>Gradients — ColorNest</title>
  <meta name="description" content="Explore beautiful CSS gradients for your next project. Copy CSS, customize linear, radial, conic and mesh gradients, and make it yours." />
  <meta name="theme-color" content="#7c3aed" />
  <link rel="canonical" href="https://color-library.pages.dev/gradients" />

  <!-- Favicons & App Manifest -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --text: #111827;
      --heading: #1e1b4b;
      --muted: #6b7280;
      --border: #eef0f4;
      --card-shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 4px 14px rgba(17, 24, 39, 0.05);
      --primary: #7c3aed;
      --tile: #f3f4f6;
      --nav-h: 68px;
    }
    html.dark {
      --bg: #0b0b14;
      --surface: #14141f;
      --text: #f3f4f6;
      --heading: #eef2ff;
      --muted: #9ca3af;
      --border: #232332;
      --card-shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
      --tile: #1d1d2b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      transition: background .25s ease, color .25s ease;
    }
    img { display: block; max-width: 100%; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: 0; background: none; }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      background: var(--bg);
      padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px);
      position: relative;
    }
    @media (min-width: 520px) {
      body { background: linear-gradient(160deg, #dcd4f5 0%, #efe6f6 50%, #d9e4f8 100%); }
      .app { box-shadow: 0 0 0 1px rgba(255,255,255,.6), 0 24px 80px rgba(76, 29, 149, .18); }
    }

    /* ---------- Header ---------- */
    .site-header {
      position: sticky; top: 0; z-index: 40;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .header-inner {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark {
      width: 40px; height: 40px; flex: none;
      background: linear-gradient(135deg, #f472b6 0%, #a855f7 45%, #3b82f6 100%);
      border-radius: 46% 54% 58% 42% / 52% 44% 56% 48%;
      box-shadow: inset 0 -3px 6px rgba(255,255,255,.45), 0 4px 10px rgba(168,85,247,.35);
    }
    .brand-name { font-size: 17px; font-weight: 800; color: var(--heading); line-height: 1.2; letter-spacing: -.01em; }
    .brand-tag { font-size: 11.5px; color: var(--muted); line-height: 1.2; }
    .header-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center;
      background: var(--tile); color: var(--text);
      transition: transform .15s ease, background .2s ease;
    }
    .icon-btn:hover { transform: translateY(-1px); }
    .icon-btn svg { width: 19px; height: 19px; }

    /* ---------- Hero ---------- */
    .hero-wrap { padding: 4px 16px 0; }
    .hero {
      position: relative;
      border-radius: 24px;
      background: linear-gradient(120deg, #e9e3f9 0%, #f4e8f6 48%, #ece7fb 100%);
      overflow: hidden;
      padding: 24px 20px 26px;
      min-height: 218px;
    }
    html.dark .hero { background: linear-gradient(120deg, #241d3f 0%, #331f3d 48%, #221d44 100%); }
    .hero-blobs {
      position: absolute;
      right: -18px; top: 22px;
      width: 52%; max-width: 220px;
      mix-blend-mode: multiply;
      opacity: .96;
      pointer-events: none;
      -webkit-mask-image: radial-gradient(ellipse closest-side at 50% 50%, #000 58%, transparent 98%);
      mask-image: radial-gradient(ellipse closest-side at 50% 50%, #000 58%, transparent 98%);
    }
    html.dark .hero-blobs { mix-blend-mode: screen; opacity: .9; }
    .hero-note {
      position: absolute; top: 14px; right: 12px;
      font-family: "Caveat", cursive;
      font-size: 18px; font-weight: 700;
      color: #7c3aed; line-height: 1.05;
      text-align: center;
      transform: rotate(4deg);
    }
    .hero-note svg { display: block; margin: 3px auto 0; width: 64px; }
    .hero h1 {
      position: relative; z-index: 2;
      font-size: clamp(30px, 9vw, 40px);
      font-weight: 800; line-height: 1.08;
      letter-spacing: -.02em;
      color: var(--heading);
    }
    .hero h1 .grad {
      background: linear-gradient(90deg, #7c3aed 0%, #a855f7 45%, #ec4899 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    .hero p {
      position: relative; z-index: 2;
      margin-top: 10px;
      font-size: 13.5px; color: #4b5563;
      max-width: 58%;
      line-height: 1.55;
    }
    html.dark .hero p { color: #c4b5fd; }

    /* ---------- Type chips ---------- */
    .types {
      display: flex; gap: 9px;
      padding: 14px 16px 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .types::-webkit-scrollbar { display: none; }
    .type-chip {
      flex: none;
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px; font-weight: 700;
      padding: 11px 18px; border-radius: 999px;
      box-shadow: var(--card-shadow);
      transition: transform .15s ease, background .2s ease, color .2s ease;
    }
    .type-chip:hover { transform: translateY(-1px); }
    .type-chip svg { width: 16px; height: 16px; }
    .type-chip.active {
      background: linear-gradient(120deg, #7c3aed 0%, #8b5cf6 100%);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 6px 16px rgba(124, 58, 237, .35);
    }

    /* ---------- Search row ---------- */
    .search-row {
      display: flex; gap: 9px;
      padding: 14px 16px 0;
    }
    .search-box {
      flex: 1; min-width: 0;
      display: flex; align-items: center; gap: 9px;
      background: var(--tile);
      border-radius: 999px;
      padding: 0 16px;
      height: 46px;
    }
    .search-box svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
    .search-box input {
      flex: 1; min-width: 0;
      border: 0; outline: 0; background: transparent;
      font-family: inherit; font-size: 14px; color: var(--text);
    }
    .search-box input::placeholder { color: var(--muted); }
    .pill-btn {
      flex: none;
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--tile); color: var(--text);
      font-size: 13.5px; font-weight: 700;
      padding: 0 16px; height: 46px; border-radius: 999px;
      transition: transform .15s ease;
    }
    .pill-btn:hover { transform: translateY(-1px); }
    .pill-btn svg { width: 17px; height: 17px; }
    .pill-btn.icon-only { width: 46px; padding: 0; justify-content: center; }

    /* ---------- Category chips ---------- */
    .cats {
      display: flex; gap: 8px;
      padding: 14px 16px 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .cats::-webkit-scrollbar { display: none; }
    .cat-chip {
      flex: none;
      background: var(--tile); color: var(--text);
      font-size: 13px; font-weight: 700;
      padding: 9px 17px; border-radius: 999px;
      transition: transform .15s ease, background .2s ease, color .2s ease;
    }
    .cat-chip:hover { transform: translateY(-1px); }
    .cat-chip.active { background: #7c3aed; color: #fff; box-shadow: 0 5px 14px rgba(124, 58, 237, .32); }

    /* ---------- Gradient grid ---------- */
    .grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px;
      padding: 16px 16px 8px;
    }
    .gcard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 7px 7px 12px;
      box-shadow: var(--card-shadow);
    }
    .gswatch {
      position: relative;
      height: 118px; border-radius: 13px;
    }
    .gbadge {
      position: absolute; top: 9px; left: 9px;
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(17, 24, 39, .28);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      font-size: 11px; font-weight: 700;
      padding: 5px 11px; border-radius: 999px;
    }
    .gbadge svg { width: 12px; height: 12px; }
    .glike {
      position: absolute; top: 7px; right: 7px;
      width: 30px; height: 30px; border-radius: 999px;
      display: grid; place-items: center;
      color: #fff;
      transition: transform .15s ease;
    }
    .glike:hover { transform: scale(1.12); }
    .glike svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; }
    .glike.liked svg { fill: currentColor; }
    .gcard { cursor: pointer; }
    .ginfo {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 10px 4px 0;
    }
    .gmeta { min-width: 0; }
    .gview {
      flex: none;
      width: 34px; height: 34px; border-radius: 999px;
      display: grid; place-items: center;
      background: var(--tile); color: #7c3aed;
      transition: transform .15s ease, background .2s ease;
    }
    .gview:hover { transform: translateY(-1px); background: #ede9fe; }
    html.dark .gview:hover { background: #2a2140; }
    .gview svg { width: 16px; height: 16px; }
    .ginfo h3 { font-size: 13.5px; font-weight: 800; color: var(--heading); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ghex {
      display: flex; align-items: center; gap: 5px;
      margin-top: 3px;
      font-size: 10.5px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ghex .dot { width: 10px; height: 10px; border-radius: 999px; flex: none; }
    .gcopy {
      position: absolute; bottom: 9px; right: 9px;
      width: 34px; height: 34px; border-radius: 999px;
      display: grid; place-items: center;
      background: rgba(17, 24, 39, .28);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      transition: transform .15s ease, background .2s ease;
    }
    .gcopy:hover { transform: translateY(-1px); }
    .gcopy svg { width: 15px; height: 15px; }
    .gcopy.copied { background: #dcfce7; color: #15803d; }
    html.dark .gcopy.copied { background: #dcfce7; color: #15803d; }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
      padding: 30px 0 14px;
    }

    /* ---------- Load more ---------- */
    .load-wrap {
      display: flex; justify-content: center;
      padding: 18px 16px 110px;
    }
    .load-wrap[hidden] { display: none; }
    .load-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: #7c3aed;
      font-family: inherit; font-size: 13px; font-weight: 800;
      padding: 12px 22px; border-radius: 999px;
      box-shadow: var(--card-shadow);
      transition: transform .15s ease, background .2s ease;
    }
    .load-btn:hover { transform: translateY(-1px); background: #f5f3ff; }
    html.dark .load-btn:hover { background: #2a2140; }

    /* ---------- Bottom nav ---------- */
    .bottom-nav {
      position: fixed; z-index: 50;
      bottom: 0; left: 0; right: 0;
      max-width: 480px; margin: 0 auto;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 10.5px; font-weight: 600; color: var(--muted);
      padding: 7px 4px; border-radius: 14px;
      transition: color .2s ease, background .2s ease;
    }
    .tab svg { width: 21px; height: 21px; }
    .tab.active { background: #ede9fe; color: #6d28d9; font-weight: 700; }
    html.dark .tab.active { background: #2c2653; color: #c4b5fd; }
    .tab:not(.active):hover { color: var(--text); }

    /* ---------- Drawer menu ---------- */
    .drawer-backdrop { position: fixed; inset: 0; background: rgba(15,10,40,.45); z-index: 90; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(300px, 84vw); background: var(--surface); z-index: 91; transform: translateX(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); box-shadow: -12px 0 40px rgba(15,10,40,.18); display: flex; flex-direction: column; padding: 14px; }
    .drawer.open { transform: translateX(0); }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 12px; border-bottom: 1px solid var(--border); }
    .drawer-title { font-weight: 800; color: var(--heading); font-size: 15px; }
    .drawer-nav { display: flex; flex-direction: column; gap: 4px; padding-top: 10px; overflow-y: auto; }
    .drawer-nav a { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; color: var(--text); font-weight: 700; font-size: 14px; text-decoration: none; }
    .drawer-nav a:hover { background: var(--tile); }
    .drawer-nav a.active { background: #f3e8ff; color: #7c3aed; }
    html.dark .drawer-nav a.active { background: #2a2140; color: #c4b5fd; }
    .drawer-nav svg { width: 18px; height: 18px; }
  </style>
  <link rel="stylesheet" href="/menu-extras.css" />
  <link rel="stylesheet" href="/brand.css?v=1" />
</head>
<body>
  <div class="app">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/" aria-label="ColorNest home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>
            <span class="brand-name">Color<span class="cn-grad">Nest</span></span><br />
            <span class="brand-tag">Colors for Creators</span>
          </span>
        </a>
        <div class="header-actions">
          <a class="icon-btn" href="#search" aria-label="Search gradients">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </a>
          <button class="icon-btn" type="button" id="theme-toggle" aria-label="Toggle theme">
            <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button class="icon-btn" type="button" aria-label="Open menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main>
      <!-- Hero -->
      <section class="hero-wrap" aria-label="Gradients intro">
        <div class="hero">
          <img class="hero-blobs" src="/public/hero-blobs.png" alt="" aria-hidden="true" />
          <div class="hero-note" aria-hidden="true">
            Gradients<br />Make<br />Designs<br />Alive
            <svg viewBox="0 0 80 10" fill="none"><path d="M2 7 C 20 2, 55 2, 78 5" stroke="#a855f7" stroke-width="2.4" stroke-linecap="round"/></svg>
          </div>
          <h1>Gra<span class="grad">dients</span></h1>
          <p>Explore 2,000+ top-rated gradients. Copy CSS, customize, and make it yours.</p>
        </div>
      </section>

      <!-- Type filter chips -->
      <div class="types" role="tablist" aria-label="Gradient type">
        <button class="type-chip active" type="button" role="tab" aria-selected="true" data-type="all">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
          All
        </button>
        <button class="type-chip" type="button" role="tab" aria-selected="false" data-type="linear">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 17 3"/><path d="M17 3h-6M17 3v6"/><path d="m7 21 14-14" opacity=".4"/></svg>
          Linear
        </button>
        <button class="type-chip" type="button" role="tab" aria-selected="false" data-type="radial">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"/></svg>
          Radial
        </button>
        <button class="type-chip" type="button" role="tab" aria-selected="false" data-type="conic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l7.8 4.5"/></svg>
          Conic
        </button>
        <button class="type-chip" type="button" role="tab" aria-selected="false" data-type="mesh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
          Mesh
        </button>
      </div>

      <!-- Search + sort + filter -->
      <div class="search-row" id="search">
        <label class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search gradients</span>
          <input type="search" id="search-input" placeholder="Search gradients..." autocomplete="off" />
        </label>
        <button class="pill-btn" type="button" id="sort-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 3v18M7 21l-3.5-3.5M7 21l3.5-3.5"/><path d="m17 21V3M17 3l-3.5 3.5M17 3l3.5 3.5"/></svg>
          Sort
        </button>
        <button class="pill-btn icon-only" type="button" aria-label="Filter gradients">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v5.5L10 21v-8L3 5z"/></svg>
        </button>
      </div>

      <!-- Category chips -->
      <div class="cats" role="tablist" aria-label="Gradient categories">
        <button class="cat-chip active" type="button" role="tab" aria-selected="true" data-cat="all">All</button>
        <button class="cat-chip" type="button" role="tab" aria-selected="false" data-cat="popular">Popular</button>
        <button class="cat-chip" type="button" role="tab" aria-selected="false" data-cat="new">New</button>
        <button class="cat-chip" type="button" role="tab" aria-selected="false" data-cat="blue">Blue</button>
        <button class="cat-chip" type="button" role="tab" aria-selected="false" data-cat="purple">Purple</button>
        <button class="cat-chip" type="button" role="tab" aria-selected="false" data-cat="pink">Pink</button>
        <button class="cat-chip" type="button" role="tab" aria-selected="false" data-cat="orange">Orange</button>
        <button class="cat-chip" type="button" role="tab" aria-selected="false" data-cat="green">Green</button>
      </div>

      <!-- Gradient cards -->
      <section class="grid" id="grid" aria-label="Gradient collection" aria-live="polite"></section>

      <!-- Load more -->
      <div class="load-wrap" id="load-wrap">
        <button class="load-btn" id="load-more" type="button">Load More Gradients</button>
      </div>
    </main>

    <!-- Bottom navigation -->

    function hslToHex(h, s, l) {
      h = ((h % 360) + 360) % 360;

      var x = c * (1 - Math.abs(((h / 60) % 2) - 1));

      if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }

        var cl = Math.max(0, Math.min(255, Math.round(v * 255)));

      }).join("").toUpperCase();
    }

      return ((h * 60) + 360) % 360;
    }

      if (h < 50) return "orange";
      return "green";

      state.query = searchInput.value.trim().toLowerCase();
      render(true);
    });

    // Sort toggles direction
    document.getElementById("sort-btn").addEventListener("click", function () {
      state.sortDesc = !state.sortDesc;
      render(true);
    });

    // Load More pagination
    loadBtn.addEventListener("click", function () {
      state.shown += PAGE_SIZE;
      render();
    });

    // Like buttons (event delegation — grid re-renders)
    grid.addEventListener("click", function (e) {
      var like = e.target.closest(".glike");
      if (like) {
        if (window.CNAuth && !window.CNAuth.gateSave()) return;
        var card = like.closest(".gcard");
        var gName = card ? (card.dataset.full || card.dataset.name) : "Gradient";
        var g = { c1: card.dataset.c1, c2: card.dataset.c2, name: gName };
        var isNowLiked = toggleSavedGradient(g);
        like.classList.toggle("liked", isNowLiked);
        like.setAttribute("aria-pressed", isNowLiked ? "true" : "false");
        like.setAttribute("aria-label", (isNowLiked ? "Remove " : "Save ") + gName);
        var toastEl = document.getElementById("toast");
        if (toastEl) {
          toastEl.textContent = isNowLiked ? "♥ Saved \"" + gName + "\" to favorites!" : "Removed \"" + gName + "\" from favorites";
          toastEl.classList.add("show");
          clearTimeout(toastEl._timer);
          toastEl._timer = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
        }
        return;
      }
      var copy = e.target.closest(".gcopy");
      if (copy) {
        var card = copy.closest(".gcard");
        var g = { c1: card.dataset.c1, c2: card.dataset.c2 };
        var css = cssFor(g, state.type);
        var iconHtml = copy.innerHTML;
        var done = function () {
          copy.classList.add("copied");
          copy.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
          setTimeout(function () {
            copy.classList.remove("copied");
            copy.innerHTML = iconHtml;
          }, 1400);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(css).then(done, done);
        } else {
          var ta = document.createElement("textarea");
          ta.value = css;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          done();
        }
        return;
      }
      // Tapping a card opens the full-screen gradient preview page
      var card = e.target.closest(".gcard");
      if (card) {
        var type = state.type === "all" ? "linear" : state.type;
        window.location.href = "/gradient-preview?c1=" + encodeURIComponent(card.dataset.c1) +
          "&c2=" + encodeURIComponent(card.dataset.c2) +
          "&name=" + encodeURIComponent(card.dataset.full || card.dataset.name) +
          "&type=" + type;
      }
    });

    // Theme toggle (shared across pages via localStorage)
    var themeBtn = document.getElementById("theme-toggle");
    themeBtn.addEventListener("click", function () {
      var dark = document.documentElement.classList.toggle("dark");
      try { localStorage.setItem("cl-theme", dark ? "dark" : "light"); } catch (e) {}
      themeBtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    });

    window.addEventListener("cn:favorites-synced", function () {
      render();
    });

    render();
  </script>
  <!-- Drawer menu -->
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>

      <span class="drawer-title">Color<span class="cn-grad">Nest</span></span>
      <button class="icon-btn" type="button" id="drawer-close" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <nav class="drawer-nav">
      <a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home</a>
      <a href="/colors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22a10 10 0 1 1 10-10c0 1.7-1.3 3-3 3h-2.2a2.8 2.8 0 0 0-2 4.8c.4.5.2 1.4-.4 1.9-.7.2-1.5.3-2.4.3z"/></svg>Colors</a>
      <a href="/color-mix"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg>Mix</a>
      <a href="/gradients" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.7s6.5 7 6.5 11.3a6.5 6.5 0 0 1-13 0C5.5 9.7 12 2.7 12 2.7z"/></svg>Gradients</a>
      <a href="/saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Saved</a>
    </nav>
  </aside>
  <script>
    (function () {
      var menuBtn = document.querySelector('[aria-label="Open menu"], [aria-label="Menu"]');
      var drawer = document.getElementById("drawer");
      var backdrop = document.getElementById("drawer-backdrop");
      if (!menuBtn || !drawer) return;
      function openDrawer() { drawer.classList.add("open"); backdrop.hidden = false; drawer.setAttribute("aria-hidden", "false"); }
      function closeDrawer() { drawer.classList.remove("open"); backdrop.hidden = true; drawer.setAttribute("aria-hidden", "true"); }
      menuBtn.addEventListener("click", openDrawer);
      document.getElementById("drawer-close").addEventListener("click", closeDrawer);
      backdrop.addEventListener("click", closeDrawer);
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });
    })();
  </script>
  <script src="/copy-limit.js"></script>
  <script src="/menu-extras.js"></script>
