<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>try{if(localStorage.getItem("cl-theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
  <script src="/copy-limit.js"></script>
  <meta name="robots" content="noindex, follow" />
  <title>Gradient Preview — ColorNest</title>
  <meta name="description" content="Full-screen preview of a beautiful CSS gradient. Copy CSS or Tailwind code and download it as PNG." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, .78);
      --glass-border: rgba(255, 255, 255, .55);
      --heading: #111827;
      --text: #374151;
      --muted: #6b7280;
      --tile: #f3f4f6;
      --card-shadow: 0 12px 32px rgba(17, 24, 39, .16);
    }
    html.dark {
      --glass-bg: rgba(17, 24, 39, .82);
      --glass-border: rgba(255, 255, 255, .12);
      --heading: #f9fafb;
      --text: #d1d5db;
      --muted: #9ca3af;
      --tile: rgba(255, 255, 255, .08);
      --card-shadow: 0 12px 32px rgba(0, 0, 0, .5);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      color: var(--text);
      overflow: hidden;
    }
    button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

    /* Full-screen gradient stage */
    .stage {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      transition: background .4s ease;
    }

    /* Top bar */
    .topbar {
      display: flex; align-items: center; gap: 10px;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 10px;
    }
    .glass-btn {
      width: 42px; height: 42px; border-radius: 999px;
      display: grid; place-items: center;
      background: rgba(255, 255, 255, .3);
      border: 1px solid rgba(255, 255, 255, .4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      box-shadow: 0 4px 14px rgba(17, 24, 39, .18);
      transition: transform .15s ease;
      flex: none;
    }
    .glass-btn:hover { transform: translateY(-1px); }
    .glass-btn svg { width: 19px; height: 19px; }
    .name-pill {
      min-width: 0;
      display: inline-flex; align-items: center;
      background: rgba(255, 255, 255, .3);
      border: 1px solid rgba(255, 255, 255, .4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      font-size: 13.5px; font-weight: 800;
      padding: 10px 16px; border-radius: 999px;
      box-shadow: 0 4px 14px rgba(17, 24, 39, .18);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 1px 3px rgba(17, 24, 39, .25);
    }

    /* Center info */
    .center {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      padding: 0 24px;
      min-height: 0;
    }
    .type-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255, 255, 255, .3);
      border: 1px solid rgba(255, 255, 255, .4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      font-size: 12px; font-weight: 700;
      padding: 7px 14px; border-radius: 999px;
      text-transform: capitalize;
      text-shadow: 0 1px 3px rgba(17, 24, 39, .25);
    }
    .type-chip svg { width: 13px; height: 13px; }
    .big-name {
      margin-top: 14px;
      color: #fff;
      font-size: clamp(26px, 8vw, 40px);
      font-weight: 800;
      letter-spacing: -.02em;
      text-shadow: 0 2px 12px rgba(17, 24, 39, .3);
      max-width: 100%;
      overflow-wrap: break-word;
    }
    .hex-row {
      margin-top: 16px;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    }
    .hex-chip {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(255, 255, 255, .3);
      border: 1px solid rgba(255, 255, 255, .4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      font-family: ui-monospace, "JetBrains Mono", monospace;
      font-size: 12.5px; font-weight: 700;
      padding: 8px 13px; border-radius: 999px;
      text-shadow: 0 1px 3px rgba(17, 24, 39, .25);
      transition: transform .15s ease;
    }
    .hex-chip:hover { transform: translateY(-1px); }
    .hex-chip .dot { width: 12px; height: 12px; border-radius: 999px; border: 2px solid rgba(255, 255, 255, .8); flex: none; }

    /* Bottom action card */
    .sheet {
      margin: 0 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 22px;
      box-shadow: var(--card-shadow);
      padding: 16px;
    }
    .sheet h2 { font-size: 15px; font-weight: 800; color: var(--heading); letter-spacing: -.01em; }
    .sheet .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .code-box {
      margin-top: 12px;
      background: #0f172a;
      border-radius: 14px;
      padding: 13px 14px;
      font-family: ui-monospace, "JetBrains Mono", monospace;
      font-size: 11px; line-height: 1.6;
      color: #e2e8f0;
      overflow-x: auto;
      white-space: pre;
    }
    .code-box .prop { color: #7dd3fc; }
    .action-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .action-btn {
      flex: 1 1 auto;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      background: var(--tile); color: var(--text);
      font-size: 12px; font-weight: 700;
      padding: 12px 10px; border-radius: 13px;
      transition: transform .15s ease, background .2s ease;
      white-space: nowrap;
    }
    .action-btn:hover { transform: translateY(-1px); }
    .action-btn svg { width: 15px; height: 15px; flex: none; }
    .action-btn.copied { background: #dcfce7; color: #15803d; }
    html.dark .action-btn.copied { background: #14321f; color: #4ade80; }
    .primary-btn {
      margin-top: 10px;
      width: 100%;
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      background: linear-gradient(120deg, #7c3aed 0%, #8b5cf6 55%, #a855f7 100%);
      color: #fff;
      font-size: 14px; font-weight: 800;
      padding: 14px 0; border-radius: 15px;
      box-shadow: 0 8px 20px rgba(124, 58, 237, .35);
      transition: transform .15s ease;
    }
    .primary-btn:hover { transform: translateY(-1px); }
    .primary-btn svg { width: 17px; height: 17px; }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 110px);
      transform: translateX(-50%) translateY(16px);
      background: #111827; color: #fff;
      font-size: 12.5px; font-weight: 700;
      padding: 10px 18px; border-radius: 999px;
      box-shadow: 0 8px 24px rgba(17, 24, 39, .35);
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      z-index: 50;
      max-width: 86vw;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <header class="topbar">
      <button class="glass-btn" id="back-btn" type="button" aria-label="Go back to gradients">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </button>
      <span class="name-pill" id="name-pill">Gradient</span>
    </header>

    <div class="center">
      <span class="type-chip" id="type-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span id="type-label">Linear</span>
      </span>
      <h1 class="big-name" id="big-name">Gradient</h1>
      <div class="hex-row">
        <button class="hex-chip" type="button" id="chip-c1" aria-label="Copy first color">
          <span class="dot" id="dot-c1"></span><span id="hex-c1">#000000</span>
        </button>
        <button class="hex-chip" type="button" id="chip-c2" aria-label="Copy second color">
          <span class="dot" id="dot-c2"></span><span id="hex-c2">#FFFFFF</span>
        </button>
      </div>
    </div>

    <section class="sheet" aria-label="Gradient code and actions">
      <h2>CSS Code</h2>
      <p class="sub">Ready to use in any project</p>
      <div class="code-box" id="code-box"></div>
      <div class="action-row">
        <button class="action-btn" type="button" id="copy-css-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy CSS
        </button>
        <button class="action-btn" type="button" id="copy-tailwind-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-5 0-7 4-7 7 1.5-1.5 3.2-2 5-1.5 1.1.3 1.9 1.1 3 2.2 1.6 1.6 3.5 2.3 6 1.3 0-3-2-6-7-8z"/><path d="M5 15c0 3 2 6 7 6s7-3 7-6c-2.5 1-4.4.3-6-1.3-1.1-1.1-1.9-1.9-3-2.2-1.8-.5-3.5 0-5 1.5z"/></svg>
          Copy as Tailwind
        </button>
        <button class="action-btn" type="button" id="download-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
          Download PNG
        </button>
      </div>
      <button class="primary-btn" type="button" id="use-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        Use This Gradient
      </button>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // ---- Read gradient from URL ----
    var params = new URLSearchParams(window.location.search);
    var c1 = (params.get("c1") || "#3B82F6").toUpperCase();
    var c2 = (params.get("c2") || "#EC4899").toUpperCase();
    var name = params.get("name") || "Custom Gradient";
    var type = params.get("type") || "linear";
    if (["linear", "radial", "conic", "mesh"].indexOf(type) === -1) type = "linear";

    function gradCss(t, a, b) {
      if (t === "radial") return "radial-gradient(circle at 30% 30%, " + a + ", " + b + ")";
      if (t === "conic") return "conic-gradient(from 180deg at 50% 50%, " + a + ", " + b + ", " + a + ")";
      if (t === "mesh") return "radial-gradient(at 20% 20%, " + a + " 0px, transparent 55%), radial-gradient(at 80% 80%, " + b + " 0px, transparent 55%), linear-gradient(135deg, " + a + ", " + b + ")";
      return "linear-gradient(135deg, " + a + " 0%, " + b + " 100%)";
    }

    var cssValue = gradCss(type, c1, c2);
    var cssCode = "background: " + cssValue + ";";

    // ---- Paint the stage ----
    document.getElementById("stage").style.background = cssValue;
    document.title = name + " Gradient — ColorNest";
    document.getElementById("name-pill").textContent = name;
    document.getElementById("big-name").textContent = name;
    document.getElementById("type-label").textContent = type.charAt(0).toUpperCase() + type.slice(1);
    document.getElementById("hex-c1").textContent = c1;
    document.getElementById("hex-c2").textContent = c2;
    document.getElementById("dot-c1").style.background = c1;
    document.getElementById("dot-c2").style.background = c2;
    document.getElementById("code-box").innerHTML =
      '<span class="prop">background</span>: ' + cssValue.replace(/, /g, ",\n  ") + ";";

    // ---- Toast helper ----
    var toast = document.getElementById("toast");
    var toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1600);
    }

    function copyText(text, msg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { showToast(msg); }, function () { showToast(msg); });
      } else {
        var ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast(msg);
      }
    }

    // ---- Actions ----
    document.getElementById("back-btn").addEventListener("click", function () {
      if (history.length > 1) history.back();
      else window.location.href = "/gradients";
    });

    document.getElementById("chip-c1").addEventListener("click", function () { copyText(c1, c1 + " copied!"); });
    document.getElementById("chip-c2").addEventListener("click", function () { copyText(c2, c2 + " copied!"); });

    function flashCopied(btn) {
      btn.classList.add("copied");
      setTimeout(function () { btn.classList.remove("copied"); }, 1400);
    }

    document.getElementById("copy-css-btn").addEventListener("click", function () {
      copyText(cssCode, "CSS copied!");
      flashCopied(this);
    });

    document.getElementById("copy-tailwind-btn").addEventListener("click", function () {
      var tw = type === "linear"
        ? 'bg-[linear-gradient(135deg,' + c1 + '_0%,' + c2 + '_100%)]'
        : 'bg-[' + cssValue.replace(/, /g, ",").replace(/ /g, "_") + ']';
      copyText('<div class="' + tw + '"></div>', "Tailwind copied!");
      flashCopied(this);
    });

    document.getElementById("download-btn").addEventListener("click", function () {
      var canvas = document.createElement("canvas");
      canvas.width = 1080; canvas.height = 1620;
      var ctx = canvas.getContext("2d");
      var grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, c1);
      grad.addColorStop(1, c2);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      var link = document.createElement("a");
      link.download = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-gradient.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
      showToast("PNG downloaded!");
    });

    document.getElementById("use-btn").addEventListener("click", function () {
      copyText(cssCode, "CSS copied — paste it in your project!");
    });
  </script>
</body>
</html>
