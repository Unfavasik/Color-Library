<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — ColorNest</title>
  <meta name="description" content="Sign in to your ColorNest account for unlimited copies, saved colors and palettes." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f6f5fb; --surface: #ffffff; --text: #1e1b4b; --muted: #6b7280;
      --border: #e5e7eb; --tile: #f3f4f6; --brand: #7c3aed; --brand2: #ec4899;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #eef2ff 0%, #fdf4ff 55%, #eff6ff 100%);
      color: var(--text); min-height: 100vh;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 20px 20px 48px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0 30px; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
    .brand-mark {
      width: 44px; height: 44px; border-radius: 14px; flex: none;
      background: conic-gradient(from 200deg, #ef4444, #f97316, #facc15, #22c55e, #06b6d4, #3b82f6, #8b5cf6, #ec4899, #ef4444);
      box-shadow: 0 6px 16px rgba(124, 58, 237, .25);
    }
    .brand h1 { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
    .brand p { font-size: 12px; color: var(--muted); font-weight: 600; }
    .signup { display: flex; align-items: center; gap: 10px; }
    .signup span { font-size: 13px; color: var(--muted); font-weight: 600; }
    .signup a {
      background: #f5f3ff; color: var(--brand); text-decoration: none;
      padding: 9px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 800;
    }
    .hero { text-align: center; margin-bottom: 26px; }
    .hero h2 { font-size: 30px; letter-spacing: -.03em; font-weight: 800; }
    .hero h2 .grad {
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
    }
    .hero .sub { margin-top: 10px; font-size: 14.5px; line-height: 1.55; color: #4b5563; font-weight: 500; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
      padding: 28px 22px; box-shadow: 0 12px 32px rgba(30, 27, 75, .08);
    }
    .card h3 { text-align: center; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
    .card .lead { text-align: center; font-size: 13.5px; color: var(--muted); font-weight: 600; margin: 6px 0 22px; }
    .field {
      display: flex; align-items: center; gap: 12px;
      border: 1.5px solid var(--border); border-radius: 16px; padding: 13px 16px; margin-bottom: 14px;
      background: #fafafa;
    }
    .field:focus-within { border-color: var(--brand); background: #fff; }
    .field svg { width: 20px; height: 20px; color: #9ca3af; flex: none; }
    .field .inp { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .field label { font-size: 12.5px; font-weight: 800; color: var(--text); }
    .field input {
      border: 0; outline: 0; background: transparent; font: inherit;
      font-size: 14px; color: var(--text); width: 100%;
    }
    .field input::placeholder { color: #9ca3af; font-weight: 500; }
    .eye { border: 0; background: transparent; cursor: pointer; color: #9ca3af; display: flex; padding: 2px; }
    .eye svg { width: 20px; height: 20px; }
    .submit {
      width: 100%; border: 0; cursor: pointer; margin-top: 6px;
      background: linear-gradient(90deg, #7c3aed, #ec4899); color: #fff;
      font-size: 15.5px; font-weight: 800; padding: 15px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 10px 24px rgba(124, 58, 237, .35);
    }
    .submit:active { transform: scale(.98); }
    .or { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: #9ca3af; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .socials { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .soc {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      border: 1.5px solid var(--border); border-radius: 16px; padding: 14px 8px;
      background: #fff; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; color: var(--text);
    }
    .soc:active { background: var(--tile); }
    .soc svg { width: 22px; height: 22px; }
    .note { text-align: center; font-size: 13px; font-weight: 600; color: #4b5563; margin-top: 18px; }
    .note a { color: var(--brand); font-weight: 800; text-decoration: none; }
    .err {
      display: none; background: #fef2f2; border: 1px solid #fecaca; color: #dc2626;
      font-size: 13px; font-weight: 700; padding: 10px 14px; border-radius: 12px; margin-bottom: 14px;
    }
    .err.show { display: block; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span><h1>ColorNest</h1><p>Colors for Creators</p></span>
      </a>
      <div class="signup">
        <span>New here?</span>
        <a href="/signup">Create Account</a>
      </div>
    </div>

    <section class="hero">
      <h2>Welcome <span class="grad">Back</span></h2>
      <p class="sub">Sign in for unlimited copies, saved colors, palettes and sync across devices.</p>
    </section>

    <section class="card">
      <h3>Sign In</h3>
      <p class="lead">Good to see you again — let&apos;s get colorful.</p>
      <div class="err" id="err" role="alert"></div>
      <form id="login-form" novalidate>
        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <span class="inp">
            <label for="email">Email Address</label>
            <input id="email" type="email" placeholder="e.g. asik@example.com" autocomplete="email" required />
          </span>
        </div>
        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span class="inp">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Your password" autocomplete="current-password" required />
          </span>
          <button class="eye" type="button" id="toggle-pass" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <button class="submit" type="submit">
          Sign In
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </button>
      </form>

      <div class="or">OR CONTINUE WITH</div>
      <div class="socials">
        <button class="soc" type="button" data-soc="Google">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.2H12v4.1h6.5c-.1 1.1-.8 2.7-2.4 3.8l3.7 2.9c2.3-2.1 3.7-5.1 3.7-8.6z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.7-2.9c-1 .7-2.4 1.2-4.2 1.2-3.2 0-6-2.1-6.9-5.1L1.2 17.2C3.2 21.2 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.1 14.3a7.5 7.5 0 0 1 0-4.6L1.2 6.8a12 12 0 0 0 0 10.4l3.9-2.9z"/><path fill="#EA4335" d="M12 4.7c2.3 0 3.8 1 4.7 1.8l3.4-3.3C18 1.2 15.2 0 12 0 7.3 0 3.2 2.8 1.2 6.8l3.9 2.9c.9-3 3.7-5 6.9-5z"/></svg>
          Google
        </button>
        <button class="soc" type="button" data-soc="GitHub">
          <svg viewBox="0 0 24 24" fill="#111827"><path d="M12 .5A11.5 11.5 0 0 0 .5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.4-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C17.3 4.9 18.3 5.2 18.3 5.2c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .4.2.7.8.6A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5z"/></svg>
          GitHub
        </button>
        <button class="soc" type="button" data-soc="Apple">
          <svg viewBox="0 0 24 24" fill="#111827"><path d="M16.7 12.9c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 2.9-.4 7.3 1.2 9.7.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.6-1-2.6-3.8zM14.4 5.6c.7-.8 1.1-1.9 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"/></svg>
          Apple
        </button>
      </div>

      <p class="note">Don&apos;t have an account? <a href="/signup">Create one free</a></p>
    </section>
  </main>

  <script>
    var form = document.getElementById("login-form");
    var err = document.getElementById("err");
    document.getElementById("toggle-pass").addEventListener("click", function () {
      var p = document.getElementById("password");
      p.type = p.type === "password" ? "text" : "password";
    });
    document.querySelectorAll(".soc").forEach(function (b) {
      b.addEventListener("click", function () {
        err.textContent = b.dataset.soc + " sign-in is coming soon. Use email for now.";
        err.classList.add("show");
      });
    });
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      err.classList.remove("show");
      var email = document.getElementById("email").value.trim().toLowerCase();
      var pass = document.getElementById("password").value;
      if (!email || !pass) { err.textContent = "Please enter your email and password."; err.classList.add("show"); return; }

      // Admin sign-in: the admin Gmail ID + password opens the admin panel.
      var ADMIN_EMAIL = "asikikbal@gmail.com";
      var ADMIN_PASS = "admin123";
      if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
        try {
          sessionStorage.setItem("cn-admin-auth", "1");
          sessionStorage.setItem("cn-admin-email", email);
        } catch (a) {}
        window.location.href = "/admin/dashboard";
        return;
      }

      var users = {};
      try { users = JSON.parse(localStorage.getItem("cn_users") || "{}"); } catch (u) {}
      var user = users[email];
      if (!user || user.pass !== pass) { err.textContent = "Wrong email or password. Try again."; err.classList.add("show"); return; }
      try { localStorage.setItem("cn_user", JSON.stringify({ name: user.name, email: email })); } catch (u) {}
      var next = new URLSearchParams(window.location.search).get("next");
      window.location.href = next && next.charAt(0) === "/" ? next : "/";
    });
  </script>
</body>
</html>
