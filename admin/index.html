<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login · ColorNest</title>
  <meta name="description" content="ColorNest admin panel login" />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink: #0f172a; --muted: #64748b; --border: #e2e8f0;
      --purple: #7c3aed; --pink: #ec4899;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0b1020;
      background-image:
        radial-gradient(600px 400px at 15% 20%, rgba(124, 58, 237, .35), transparent 60%),
        radial-gradient(500px 380px at 85% 80%, rgba(236, 72, 153, .28), transparent 60%),
        radial-gradient(400px 300px at 80% 10%, rgba(59, 130, 246, .22), transparent 60%);
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 400px;
      background: rgba(255, 255, 255, .98);
      border-radius: 24px; padding: 36px 30px 30px;
      box-shadow: 0 30px 80px rgba(2, 6, 23, .55);
      text-align: center;
    }
    .logo {
      width: 68px; height: 68px; margin: 0 auto 14px; border-radius: 20px;
      background: conic-gradient(from 200deg, #ef4444, #f97316, #facc15, #22c55e, #06b6d4, #3b82f6, #8b5cf6, #ec4899, #ef4444);
      box-shadow: 0 12px 30px rgba(124, 58, 237, .4);
    }
    h1 { font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: -.02em; }
    h1 .cn-grad {
      background: linear-gradient(90deg, #ec4899, #f97316, #eab308, #22c55e, #06b6d4, #8b5cf6);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    .sub { font-size: 13.5px; color: var(--muted); margin-top: 6px; font-weight: 600; }
    form { margin-top: 24px; text-align: left; display: grid; gap: 14px; }
    label { font-size: 12.5px; font-weight: 700; color: var(--ink); display: block; margin-bottom: 6px; }
    .field {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
      border-radius: 12px; font-size: 14.5px; font-weight: 600; color: var(--ink);
      outline: none; background: #f8fafc; transition: border-color .15s, box-shadow .15s;
    }
    .field:focus { border-color: var(--purple); box-shadow: 0 0 0 4px rgba(124, 58, 237, .12); background: #fff; }
    .err {
      display: none; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca;
      border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 700;
    }
    .err.show { display: block; }
    .submit {
      margin-top: 4px; padding: 13px; border: 0; border-radius: 12px; cursor: pointer;
      font-size: 15px; font-weight: 800; color: #fff; font-family: inherit;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      box-shadow: 0 10px 24px rgba(124, 58, 237, .35);
      transition: transform .12s, box-shadow .12s;
    }
    .submit:hover { transform: translateY(-1px); box-shadow: 0 14px 30px rgba(124, 58, 237, .45); }
    .hint { margin-top: 18px; font-size: 12px; color: var(--muted); font-weight: 600; line-height: 1.6; }
    .hint code { background: #f1f5f9; border-radius: 6px; padding: 2px 7px; font-weight: 700; color: var(--ink); }
    .back { display: inline-block; margin-top: 14px; font-size: 12.5px; font-weight: 700; color: var(--purple); text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true"></div>
    <h1><span class="cn-grad">ColorNest</span> Admin</h1>
    <p class="sub">Sign in to the admin panel</p>
    <form id="login-form" novalidate>
      <div>
        <label for="email">Gmail ID</label>
        <input class="field" id="email" type="email" autocomplete="email" placeholder="you@gmail.com" />
      </div>
      <div>
        <label for="password">Password</label>
        <input class="field" id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <p class="err" id="err" role="alert">Enter a valid Gmail address and a password of at least 6 characters.</p>
      <button class="submit" type="submit">Sign In</button>
    </form>
    <p class="hint">Sign in with your Gmail ID and password to open the admin panel.</p>
    <a class="back" href="/">← Back to ColorNest</a>
  </main>
  <script>
    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var email = document.getElementById("email").value.trim().toLowerCase();
      var p = document.getElementById("password").value;
      var err = document.getElementById("err");
      var valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) && p.length >= 6;
      if (valid) {
        try {
          sessionStorage.setItem("cn-admin-auth", "1");
          sessionStorage.setItem("cn-admin-email", email);
        } catch (err2) {}
        window.location.href = "/admin/dashboard";
      } else {
        err.classList.add("show");
      }
    });
  </script>
</body>
</html>
