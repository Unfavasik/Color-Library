<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1000, viewport-fit=cover" />
    <title>Admin Access · ColorNest</title>
    <meta name="description" content="ColorNest admin panel access" />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink: #0f172a; --muted: #64748b; --border: #e2e8f0;
      --purple: #7c3aed; --pink: #ec4899;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0b1020;
      background-image:
        radial-gradient(600px 400px at 15% 20%, rgba(124, 58, 237, .35), transparent 60%),
        radial-gradient(500px 380px at 85% 80%, rgba(236, 72, 153, .28), transparent 60%),
        radial-gradient(400px 300px at 80% 10%, rgba(59, 130, 246, .22), transparent 60%);
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 400px;
      background: rgba(255, 255, 255, .98);
      border-radius: 24px; padding: 36px 30px 30px;
      box-shadow: 0 30px 80px rgba(2, 6, 23, .55);
      text-align: center;
    }
    .view { display: none; }
    .view.active { display: block; }
    .logo {
      width: 68px; height: 68px; margin: 0 auto 14px; border-radius: 20px;
      background: conic-gradient(from 200deg, #ef4444, #f97316, #facc15, #22c55e, #06b6d4, #3b82f6, #8b5cf6, #ec4899, #ef4444);
      box-shadow: 0 12px 30px rgba(124, 58, 237, .4);
    }
    h1 { font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: -.02em; }
    h1 .cn-grad {
      background: linear-gradient(90deg, #ec4899, #f97316, #eab308, #22c55e, #06b6d4, #8b5cf6);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    .sub { font-size: 13.5px; color: var(--muted); margin-top: 6px; font-weight: 600; }

    /* Loading view */
    .spinner {
      width: 46px; height: 46px; margin: 8px auto 18px;
      border: 4px solid rgba(124, 58, 237, .15); border-top-color: var(--purple);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13.5px; color: var(--muted); font-weight: 700; }

    /* Access denied view */
    .lock {
      width: 74px; height: 74px; margin: 6px auto 18px; border-radius: 50%;
      background: #fef2f2; border: 1.5px solid #fecaca;
      display: flex; align-items: center; justify-content: center;
    }
    .lock svg { width: 34px; height: 34px; color: #dc2626; }
    .denied-title { font-size: 20px; font-weight: 800; color: var(--ink); }
    .denied-msg { font-size: 13.5px; color: var(--muted); font-weight: 600; margin-top: 8px; line-height: 1.6; }
    .denied-email {
      display: inline-block; margin-top: 10px; font-size: 12px; font-weight: 700; color: var(--ink);
      background: #f1f5f9; border-radius: 8px; padding: 5px 10px; word-break: break-all;
    }
    .denied-actions { margin-top: 22px; display: grid; gap: 10px; }
    .btn-logout {
      padding: 12px; border: 0; border-radius: 12px; cursor: pointer; font-family: inherit;
      font-size: 14px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #dc2626, #f97316);
      box-shadow: 0 10px 24px rgba(220, 38, 38, .3);
    }
    .btn-home {
      display: block; padding: 12px; border-radius: 12px; text-decoration: none;
      font-size: 14px; font-weight: 800; color: var(--purple); background: #f5f3ff;
      border: 1.5px solid #ddd6fe;
    }
  </style>
  <link rel="stylesheet" href="/menu-extras.css?v=7" />
  <link rel="stylesheet" href="/desktop.css?v=4" />
  <script src="/desktop-shell.js?v=2" defer></script>
  <script type="module" src="/js/supabase-init.js?v=2"></script>
  <link rel="stylesheet" href="/brand.css?v=1" />
</head>
<body>
  <main class="card">

    <!-- View: checking existing session -->
    <section class="view active" id="view-loading" aria-live="polite">
      <div class="logo" aria-hidden="true"></div>
      <h1><span class="cn-grad">ColorNest</span> Admin</h1>
      <div class="spinner" style="margin-top:26px"></div>
      <p class="loading-text">Verifying your session&hellip;</p>
    </section>

    <!-- View: access denied (also shown to signed-out visitors) -->
    <section class="view" id="view-denied">
      <div class="lock" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 class="denied-title">Access Denied</h1>
      <p class="denied-msg" id="denied-msg">You don&rsquo;t have permission to access this dashboard.</p>
      <p class="denied-email" id="denied-email"></p>
      <div class="denied-actions">
        <a class="btn-home" id="denied-signin" href="/login?next=/admin" style="display:none">Sign In to Admin &rarr;</a>
        <button class="btn-logout" id="denied-logout" type="button">Log Out</button>
        <a class="btn-home" href="/">Back to Home</a>
      </div>
    </section>

  </main>

  <script>
    (function () {
      var views = { loading: document.getElementById("view-loading"), denied: document.getElementById("view-denied") };
      function show(name) {
        Object.keys(views).forEach(function (k) { views[k].classList.toggle("active", k === name); });
      }
      function storedToken() {
        try { return sessionStorage.getItem("cn_token"); } catch (e) { return null; }
      }
      function clearAdminSession() {
        try {
          sessionStorage.removeItem("cn-admin-auth");
          sessionStorage.removeItem("cn-admin-email");
          sessionStorage.removeItem("cn_token");
        } catch (e) {}
        if (window.cnSupabase) { try { window.cnSupabase.signOut(); } catch (e) {} }
      }
      function waitForBackend(timeout) {
        return new Promise(function (resolve) {
          if (window.cnSupabase) return resolve();
          var done = false;
          function finish() { if (!done) { done = true; resolve(); } }
          window.addEventListener("cn:supabase-ready", finish, { once: true });
          setTimeout(finish, timeout || 2500);
        });
      }
      // Returns: { status, body? } — status is the HTTP status or "error"/"anonymous"
      function verifyToken(token) {
        if (!token) return Promise.resolve({ status: "anonymous" });
        return fetch("/api/admin/verify", { headers: { Authorization: "Bearer " + token } })
          .then(function (r) {
            return r.json().then(function (d) { return { status: r.status, body: d }; });
          })
          .catch(function () { return { status: "error" }; });
      }
      function showDenied(opts) {
        opts = opts || {};
        document.getElementById("denied-email").textContent = opts.email || "";
        document.getElementById("denied-msg").textContent = opts.message || "You don\u2019t have permission to access this dashboard.";
        // Signed-out visitors get a Sign In button (login happens on the
        // main site's login page); signed-in non-admins get Log Out.
        document.getElementById("denied-signin").style.display = opts.anonymous ? "block" : "none";
        document.getElementById("denied-logout").style.display = opts.anonymous ? "none" : "block";
        show("denied");
      }

      // ---------- AdminRoute: loading -> dashboard / denied ----------
      // There is no separate admin login page: admins sign in on the main
      // site's /login page (email/password or Google) and are redirected
      // here automatically when their email is on the whitelist.
      waitForBackend().then(function () {
        var token = null;
        if (window.cnSupabase && window.cnSupabase.supabase) {
          token = window.cnSupabase.supabase.auth.getSession().then(function (d) {
            return (d && d.data && d.data.session && d.data.session.access_token) || storedToken();
          });
        } else {
          token = storedToken();
        }
        Promise.resolve(token).then(verifyToken).then(function (result) {
          if (result.status === 200) {
            window.location.replace("/admin/dashboard");
          } else if (result.status === 403) {
            showDenied({ email: result.body && result.body.email });
          } else if (result.status === 401 || result.status === "anonymous") {
            if (result.status === 401) clearAdminSession();
            showDenied({
              anonymous: true,
              message: "Please sign in with an authorized admin account on the ColorNest sign-in page."
            });
          } else {
            showDenied({ message: "Authorization check failed. Please try again." });
          }
        });
      });

      // ---------- Access denied actions ----------
      document.getElementById("denied-logout").addEventListener("click", function () {
        clearAdminSession();
        showDenied({ anonymous: true, message: "You have been signed out." });
        setTimeout(function () { window.location.replace("/admin"); }, 400);
      });
    })();
  </script>
  <script src="/menu-extras.js?v=4"></script>
</body>
</html>
