<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="author" content="Dev Asik, web developer and creator of Color Library" />
  <meta name="keywords" content="colors, color names, hex colors, color codes, color picker, css colors, color library" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <title>Colors — ColorNest</title>
  <meta name="description" content="Browse 2,765 colors with names and hex codes. Search, filter by family, copy hex codes, and find the perfect color for your next project." />
  <meta name="theme-color" content="#7c3aed" />

  <!-- Favicons & App Manifest -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --text: #111827;
      --heading: #1e1b4b;
      --muted: #6b7280;
      --border: #eef0f4;
      --card-shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 4px 14px rgba(17, 24, 39, 0.05);
      --primary: #7c3aed;
      --tile: #f3f4f6;
      --nav-h: 68px;
    }
    html.dark {
      --bg: #0b0b14;
      --surface: #14141f;
      --text: #f3f4f6;
      --heading: #eef2ff;
      --muted: #9ca3af;
      --border: #232332;
      --card-shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
      --tile: #1d1d2b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      transition: background .25s ease, color .25s ease;
    }
    img { display: block; max-width: 100%; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: 0; background: none; }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      background: var(--bg);
      padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px);
      position: relative;
    }
    @media (min-width: 520px) {
      body { background: linear-gradient(160deg, #dcd4f5 0%, #efe6f6 50%, #d9e4f8 100%); }
      .app { box-shadow: 0 0 0 1px rgba(255,255,255,.6), 0 24px 80px rgba(76, 29, 149, .18); }
    }

    /* ---------- Header ---------- */
    .site-header {
      position: sticky; top: 0; z-index: 40;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .header-inner {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark {
      width: 40px; height: 40px; flex: none;
      background: linear-gradient(135deg, #f472b6 0%, #a855f7 45%, #3b82f6 100%);
      border-radius: 46% 54% 58% 42% / 52% 44% 56% 48%;
      box-shadow: inset 0 -3px 6px rgba(255,255,255,.45), 0 4px 10px rgba(168,85,247,.35);
    }
    .brand-name { font-size: 17px; font-weight: 800; color: var(--heading); line-height: 1.2; letter-spacing: -.01em; }
    .brand-tag { font-size: 11.5px; color: var(--muted); line-height: 1.2; }
    .header-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center;
      background: var(--tile); color: var(--text);
      transition: transform .15s ease, background .2s ease;
    }
    .icon-btn:hover { transform: translateY(-1px); }
    .icon-btn svg { width: 19px; height: 19px; }

    /* ---------- Hero ---------- */
    .hero-wrap { padding: 4px 16px 0; }
    .hero {
      position: relative;
      border-radius: 24px;
      background: linear-gradient(120deg, #e9e3f9 0%, #f4e8f6 48%, #ece7fb 100%);
      overflow: hidden;
      padding: 24px 20px 26px;
      min-height: 218px;
    }
    html.dark .hero { background: linear-gradient(120deg, #241d3f 0%, #331f3d 48%, #221d44 100%); }
    .hero-blobs {
      position: absolute;
      right: -18px; top: 22px;
      width: 52%; max-width: 220px;
      mix-blend-mode: multiply;
      opacity: .96;
      pointer-events: none;
      -webkit-mask-image: radial-gradient(ellipse closest-side at 50% 50%, #000 58%, transparent 98%);
      mask-image: radial-gradient(ellipse closest-side at 50% 50%, #000 58%, transparent 98%);
    }
    html.dark .hero-blobs { mix-blend-mode: screen; opacity: .9; }
    .hero-note {
      position: absolute; top: 14px; right: 12px;
      font-family: "Caveat", cursive;
      font-size: 18px; font-weight: 700;
      color: #7c3aed; text-align: center; line-height: 1.15;
      transform: rotate(4deg);
      z-index: 2;
    }
    .hero-note svg { display: block; margin: 2px auto 0; width: 72px; }
    .hero h1 {
      font-size: clamp(30px, 9vw, 40px);
      font-weight: 800; letter-spacing: -.02em;
      color: var(--heading);
      line-height: 1.05;
    }
    .hero h1 .grad {
      background: linear-gradient(90deg, #7c3aed 0%, #a855f7 45%, #ec4899 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    .hero p {
      margin-top: 10px;
      font-size: 12px; color: #4b5563;
      max-width: 66%;
      line-height: 1.5;
    }
    html.dark .hero p { color: #c4b5fd; }

    /* ---------- Search row ---------- */
    .search-row {
      display: flex; gap: 8px;
      padding: 16px 16px 0;
    }
    .search-box {
      flex: 1; min-width: 0;
      display: flex; align-items: center; gap: 8px;
      background: var(--tile);
      border-radius: 14px;
      padding: 0 13px;
      height: 46px;
    }
    .search-box svg { width: 17px; height: 17px; color: var(--muted); flex: none; }
    .search-box input {
      flex: 1; min-width: 0; border: 0; outline: 0; background: none;
      font-family: inherit; font-size: 12.5px; color: var(--text);
    }
    .pill-btn {
      flex: none;
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--tile); color: var(--text);
      font-size: 12.5px; font-weight: 700;
      padding: 0 14px; height: 46px; border-radius: 14px;
      transition: transform .15s ease;
    }
    .pill-btn:hover { transform: translateY(-1px); }
    .pill-btn svg { width: 15px; height: 15px; }
    .pill-btn.icon-only { padding: 0; width: 46px; justify-content: center; }

    /* ---------- Category chips ---------- */
    .cats {
      display: flex; gap: 7px;
      padding: 14px 16px 2px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .cats::-webkit-scrollbar { display: none; }
    .cat-chip {
      flex: none;
      background: var(--tile); color: var(--text);
      font-size: 12.5px; font-weight: 700;
      padding: 9px 15px; border-radius: 999px;
      transition: background .2s ease, color .2s ease, transform .15s ease;
    }
    .cat-chip:hover { transform: translateY(-1px); }
    .cat-chip.active {
      background: linear-gradient(120deg, #7c3aed 0%, #8b5cf6 100%);
      color: #fff;
      box-shadow: 0 4px 12px rgba(124, 58, 237, .35);
    }

    /* ---------- Color grid ---------- */
    .grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;
      padding: 16px 16px 0;
    }
    .ccard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      display: flex; flex-direction: column;
      min-width: 0;
    }
    .swatch {
      position: relative;
      height: 92px;
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 10px;
    }
    .type-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(17, 24, 39, .28);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      font-size: 10.5px; font-weight: 700;
      padding: 5px 9px; border-radius: 999px;
    }
    .type-badge svg { width: 11px; height: 11px; }
    .like-btn {
      width: 30px; height: 30px; border-radius: 999px;
      display: grid; place-items: center;
      background: rgba(255,255,255,.22);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      transition: transform .15s ease;
    }
    .like-btn:hover { transform: scale(1.1); }
    .like-btn svg { width: 16px; height: 16px; }
    .like-btn.liked svg { fill: #fff; }
    .ccard-body {
      display: flex; align-items: center; gap: 5px;
      padding: 10px 9px 12px;
      min-width: 0;
    }
    .ccard-info { min-width: 0; flex: 1; }
    .ccard-info h3 {
      font-size: 10px; font-weight: 800; color: var(--heading);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      letter-spacing: -.02em;
    }
    .ccard-info p {
      font-size: 8px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-top: 1px; letter-spacing: -.02em;
    }
    .ccard-actions { display: flex; gap: 4px; flex: none; }
    .mini-btn.view { color: #7c3aed; }
    .mini-btn.view:hover { background: #ede9fe; }
    html.dark .mini-btn.view:hover { background: #2a2140; }
    .mini-btn {
      width: 26px; height: 26px; border-radius: 9px;
      display: grid; place-items: center;
      background: var(--tile); color: var(--text);
      transition: transform .15s ease, background .2s ease;
    }
    .mini-btn:hover { transform: translateY(-1px); background: #ede9fe; color: #6d28d9; }
    html.dark .mini-btn:hover { background: #2c2653; color: #c4b5fd; }
    .mini-btn svg { width: 13px; height: 13px; }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
      padding: 30px 0 14px;
    }

    /* ---------- Load more ---------- */
    .load-wrap {
      display: flex; justify-content: center;
      padding: 18px 16px 110px;
    }
    .load-wrap[hidden] { display: none; }
    .load-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: #7c3aed;
      font-family: inherit; font-size: 13px; font-weight: 800;
      padding: 12px 22px; border-radius: 999px;
      box-shadow: var(--card-shadow);
      transition: transform .15s ease, background .2s ease;
    }
    .load-btn:hover { transform: translateY(-1px); background: #f5f3ff; }
    html.dark .load-btn:hover { background: #2a2140; }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed; z-index: 60;
      left: 50%; bottom: calc(var(--nav-h) + 20px);
      transform: translateX(-50%) translateY(8px);
      background: #111827; color: #fff;
      font-size: 12.5px; font-weight: 700;
      padding: 10px 18px; border-radius: 999px;
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      box-shadow: 0 10px 30px rgba(17,24,39,.35);
      white-space: nowrap;
    }
    html.dark .toast { background: #f3f4f6; color: #111827; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ---------- Bottom nav ---------- */
    .bottom-nav {
      position: fixed; z-index: 50;
      bottom: 0; left: 0; right: 0;
      max-width: 480px; margin: 0 auto;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 10.5px; font-weight: 600; color: var(--muted);
      padding: 7px 4px; border-radius: 14px;
      transition: color .2s ease, background .2s ease;
    }
    .tab svg { width: 21px; height: 21px; }
    .tab.active { background: #ede9fe; color: #6d28d9; font-weight: 700; }
    html.dark .tab.active { background: #2c2653; color: #c4b5fd; }
    .tab:not(.active):hover { color: var(--text); }

    /* ---------- Drawer menu ---------- */
    .drawer-backdrop { position: fixed; inset: 0; background: rgba(15,10,40,.45); z-index: 90; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(300px, 84vw); background: var(--surface); z-index: 91; transform: translateX(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); box-shadow: -12px 0 40px rgba(15,10,40,.18); display: flex; flex-direction: column; padding: 14px; }
    .drawer.open { transform: translateX(0); }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 12px; border-bottom: 1px solid var(--border); }
    .drawer-title { font-weight: 800; color: var(--heading); font-size: 15px; }
    .drawer-nav { display: flex; flex-direction: column; gap: 4px; padding-top: 10px; overflow-y: auto; }
    .drawer-nav a { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; color: var(--text); font-weight: 700; font-size: 14px; text-decoration: none; }
    .drawer-nav a:hover { background: var(--tile); }
    .drawer-nav a.active { background: #f3e8ff; color: #7c3aed; }
    html.dark .drawer-nav a.active { background: #2a2140; color: #c4b5fd; }
    .drawer-nav svg { width: 18px; height: 18px; }
  </style>
  <link rel="stylesheet" href="/menu-extras.css" />
</head>

  <script>
    (function () {
      "use strict";

      var COLORS = Array.isArray(window.COLOR_DATA) ? window.COLOR_DATA : [];
      var PAGE_SIZE = 24;
      var state = { cat: "all", query: "", sortDesc: false, shown: PAGE_SIZE };

      var grid = document.getElementById("grid");
      var loadBtn = document.getElementById("load-more");
      var loadWrap = document.getElementById("load-wrap");
      var searchInput = document.getElementById("search-input");
      var toast = document.getElementById("toast");
      var toastTimer = null;

      // ---------- Color family classification ----------
      function hexToHue(hex) {
        var r = parseInt(hex.slice(1, 3), 16) / 255;
        var g = parseInt(hex.slice(3, 5), 16) / 255;
        var b = parseInt(hex.slice(5, 7), 16) / 255;
        var max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min, h = 0;
        if (!d) return -1;
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        return ((h * 60) + 360) % 360;
      }

      function familyOf(hex) {
        var h = hexToHue(hex);
        if (h === -1) return "gray";
        var r = parseInt(hex.slice(1, 3), 16);
        var g = parseInt(hex.slice(3, 5), 16);
        var b = parseInt(hex.slice(5, 7), 16);
        var max = Math.max(r, g, b), min = Math.min(r, g, b);
        var sat = max === 0 ? 0 : (max - min) / max;
        if (sat < 0.18) return "gray";
        if (h < 15 || h >= 345) return "red";
        if (h < 45) return "orange";
        if (h < 70) return "yellow";
        if (h < 160) return "green";
        if (h < 200) return "cyan";
        if (h < 260) return "blue";
        if (h < 300) return "purple";
        return "pink";
      }

      // Pre-compute families once
      COLORS.forEach(function (c) { c.family = familyOf(c.hex.toUpperCase()); });

      // ---------- Rendering ----------
      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (ch) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
        });
      }

      function cardHTML(c, i) {
        var hex = c.hex.toUpperCase();
        return '' +
          '<article class="ccard">' +
            '<div class="swatch" style="background:' + hex + '">' +
              '<span class="type-badge">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7s6.5 7 6.5 11.3a6.5 6.5 0 0 1-13 0C5.5 9.7 12 2.7 12 2.7z"/></svg>' +
                'Color' +
              '</span>' +
              '<button class="like-btn" type="button" data-like="' + i + '" aria-label="Save ' + esc(c.name) + '" aria-pressed="false">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.3 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3.4 1-4.5 2.5C10.9 4 9.3 3 7.5 3A5.5 5.5 0 0 0 2 8.5c0 2.2 1.5 4 3 5.5l7 7z"/></svg>' +
              '</button>' +
            '</div>' +
            '<div class="ccard-body">' +
              '<div class="ccard-info">' +
                '<h3>' + esc(c.name) + '</h3>' +
                '<p>' + hex + '</p>' +
              '</div>' +
              '<div class="ccard-actions">' +
                '<button class="mini-btn" type="button" data-copy="' + hex + '" aria-label="Copy ' + hex + '">' +
                  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
                '</button>' +
              '</div>' +
            '</div>' +
          '</article>';
      }

      function render(reset) {
        if (reset) state.shown = PAGE_SIZE;
        var list = COLORS.filter(function (c) {
          if (state.cat !== "all" && c.family !== state.cat) return false;
          if (state.query) {
            var name = c.name.toLowerCase();
            var hex = c.hex.toLowerCase();
            if (name.indexOf(state.query) === -1 && hex.indexOf(state.query) === -1) return false;
          }
          return true;
        });
        if (state.sortDesc) list = list.slice().reverse();

        if (!list.length) {
          grid.innerHTML = '<p class="empty">No colors found. Try a different search.</p>';
          loadWrap.hidden = true;
          return;
        }

        var page = list.slice(0, state.shown);
        loadWrap.hidden = state.shown >= list.length;
        loadBtn.textContent = "Load More Colors (" + (list.length - state.shown).toLocaleString() + " left)";

        // Map filtered index to original index for copy/like handlers
        grid.innerHTML = page.map(function (c) {
          return cardHTML(c, COLORS.indexOf(c));
        }).join("");
      }

      // ---------- Toast ----------
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1800);
      }

      // ---------- Events ----------
      grid.addEventListener("click", function (e) {
        var prev = e.target.closest("[data-preview]");
        if (prev) {
          var name = prev.closest(".ccard").querySelector(".ccard-info h3").textContent;
          window.location.href = "/color-preview?hex=" + encodeURIComponent(prev.dataset.preview) + "&name=" + encodeURIComponent(name);
          return;
        }
        var copy = e.target.closest("[data-copy]");
        if (copy) {
          var val = copy.dataset.copy;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(val).then(function () { showToast(val + " copied!"); });
          } else {
            showToast(val);
          }
          return;
        }
        var like = e.target.closest("[data-like]");
        if (like) {
          if (window.CNAuth && !CNAuth.gateSave()) return;
          var liked = like.classList.toggle("liked");
          like.setAttribute("aria-pressed", String(liked));
          showToast(liked ? "Added to Saved" : "Removed from Saved");
        }
      });

      document.querySelectorAll(".cat-chip").forEach(function (chip) {
        chip.addEventListener("click", function () {
          document.querySelectorAll(".cat-chip").forEach(function (c) {
            c.classList.remove("active");
            c.setAttribute("aria-selected", "false");
          });
          chip.classList.add("active");
          chip.setAttribute("aria-selected", "true");
          state.cat = chip.dataset.cat;
          render(true);
        });
      });

      searchInput.addEventListener("input", function () {
        state.query = searchInput.value.trim().toLowerCase();
        render(true);
      });

      document.getElementById("sort-btn").addEventListener("click", function () {
        state.sortDesc = !state.sortDesc;
        render(true);
      });

      loadBtn.addEventListener("click", function () {
        state.shown += PAGE_SIZE;
        render();
      });

      // ---------- Theme toggle (shared across pages via localStorage) ----------
      var themeBtn = document.getElementById("theme-toggle");
      themeBtn.addEventListener("click", function () {
        var dark = document.documentElement.classList.toggle("dark");
        try { localStorage.setItem("cl-theme", dark ? "dark" : "light"); } catch (err) {}
        themeBtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
      });

      render();
    })();
  </script>
  <!-- Drawer menu -->
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Navigation menu">
    <div class="drawer-head">
      <span class="drawer-title">Color<span class="cn-grad">Nest</span></span>
      <button class="icon-btn" type="button" id="drawer-close" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <nav class="drawer-nav">
      <a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home</a>
      <a href="/colors" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22a10 10 0 1 1 10-10c0 1.7-1.3 3-3 3h-2.2a2.8 2.8 0 0 0-2 4.8c.4.5.2 1.4-.4 1.9-.7.2-1.5.3-2.4.3z"/></svg>Colors</a>
      <a href="/color-mix"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg>Mix</a>
      <a href="/gradients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.7s6.5 7 6.5 11.3a6.5 6.5 0 0 1-13 0C5.5 9.7 12 2.7 12 2.7z"/></svg>Gradients</a>
      <a href="/saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Saved</a>
    </nav>
  </aside>
  <script>
    (function () {
      var menuBtn = document.querySelector('[aria-label="Open menu"], [aria-label="Menu"]');
      var drawer = document.getElementById("drawer");
      var backdrop = document.getElementById("drawer-backdrop");
      if (!menuBtn || !drawer) return;
      function openDrawer() { drawer.classList.add("open"); backdrop.hidden = false; drawer.setAttribute("aria-hidden", "false"); }
      function closeDrawer() { drawer.classList.remove("open"); backdrop.hidden = true; drawer.setAttribute("aria-hidden", "true"); }
      menuBtn.addEventListener("click", openDrawer);
      document.getElementById("drawer-close").addEventListener("click", closeDrawer);
      backdrop.addEventListener("click", closeDrawer);
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });
    })();
  </script>
  <script src="/copy-limit.js"></script>
  <script src="/menu-extras.js"></script>
</body>
</html>
